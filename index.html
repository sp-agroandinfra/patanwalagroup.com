<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahil Patanwala — SP Agro & Infra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-deep:  #0d1b2e;
      --navy-mid:   #132644;
      --navy-light: #1c3a60;
      --gold:       #c9a84c;
      --gold-light: #e2c47a;
      --gold-dim:   #8a6e30;
      --white:      #ffffff;
      --off-white:  #dce6f0;
      --muted:      #8fa3bc;
    }

    html, body {
      height: 100%;
      background: var(--navy-deep);
      font-family: 'Montserrat', sans-serif;
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Background ── */
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%,   #1e3d6e 0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 20% 100%,  #0b2040 0%, transparent 60%),
        linear-gradient(175deg, #152b4e 0%, #0d1b2e 55%, #070f1c 100%);
      z-index: 0;
    }

    /* subtle animated particles */
    .particle {
      position: fixed;
      border-radius: 50%;
      background: rgba(201, 168, 76, 0.08);
      animation: drift linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes drift {
      0%   { transform: translateY(110vh) translateX(0);   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
    }

    /* ── Wrapper ── */
    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 56px;
      gap: 0;
    }

    /* ── Logo ── */
    .logo-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: linear-gradient(145deg, #1e3558, #0d1b2e);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 6px rgba(201,168,76,0.08), 0 8px 32px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .logo-ring img {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
    }
    /* Fallback monogram if image fails */
    .logo-monogram {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 2px;
    }

    /* ── Brand text ── */
    .brand-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: clamp(22px, 6vw, 32px);
      letter-spacing: 0.06em;
      color: var(--white);
      text-align: center;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .brand-group {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: clamp(11px, 3vw, 13px);
      letter-spacing: 0.22em;
      color: var(--gold);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 14px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      margin: 0 auto 14px;
    }

    .founder-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 500;
      color: var(--off-white);
      text-align: center;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .founder-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: clamp(9px, 2.5vw, 10px);
      letter-spacing: 0.28em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 32px;
    }

    /* ── Action buttons ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 28px;
    }

    /* Contact Us — primary expandable */
    .btn-contact-wrap { position: relative; }

    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid rgba(201,168,76,0.3);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      text-decoration: none;
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:hover::before, .btn:active::before { opacity: 1; }
    .btn:hover { border-color: rgba(201,168,76,0.6); background: rgba(255,255,255,0.07); }

    .btn.btn-primary {
      border-color: var(--gold-dim);
      background: linear-gradient(135deg, rgba(201,168,76,0.14) 0%, rgba(201,168,76,0.04) 100%);
    }
    .btn.btn-primary:hover { border-color: var(--gold); }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-icon svg { width: 16px; height: 16px; }

    .btn-label { flex: 1; text-align: left; }
    .btn-label span {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1px;
    }

    .btn-chevron {
      transition: transform 0.25s;
      color: var(--gold-dim);
    }
    .btn-chevron.open { transform: rotate(180deg); }

    /* Sub-options dropdown */
    .contact-sub {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s;
      opacity: 0;
    }
    .contact-sub.open {
      max-height: 200px;
      opacity: 1;
    }
    .sub-inner {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 8px;
    }

    .btn-sub {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none;
      color: var(--off-white);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .btn-sub:hover { border-color: rgba(201,168,76,0.3); background: rgba(255,255,255,0.06); }

    .sub-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: rgba(201,168,76,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sub-icon svg { width: 13px; height: 13px; }

    .sub-detail { flex: 1; text-align: left; }
    .sub-detail small {
      display: block;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1px;
    }

    /* ── Footer line ── */
    .footer-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .footer-line-bar {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.25));
    }
    .footer-line-bar.right {
      background: linear-gradient(90deg, rgba(201,168,76,0.25), transparent);
    }
    .footer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
    }

    /* ── LinkedIn badge color override ── */
    .linkedin-color { color: #0a66c2; }

    /* ── Responsive ── */
    @media (max-width: 380px) {
      .brand-name { font-size: 20px; }
    }
  </style>
</head>
